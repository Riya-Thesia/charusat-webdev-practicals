# Practical 11: Multi-Container Orchestration with Docker Compose
# Course: ITUE301 Advanced Web Development Frameworks
# Student: Riya Thesia (CHARUSAT)

version: '3.8'

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: charusat-task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    environment:
      - MONGO_INITDB_DATABASE=taskdb

  # 2. Node.js Express REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: charusat-task-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=charusat_itue301_production_jwt_secret_key_2026
    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. React Vite Frontend Client Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: charusat-task-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network

# Named volume for database persistence across container restarts (Supplementary Requirement)
volumes:
  mongo-data:
    driver: local

# Internal Docker bridge network for isolated inter-service communication
networks:
  app-network:
    driver: bridge
